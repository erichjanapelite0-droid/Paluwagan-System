
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Paluwagan Management System</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- HEADER -->

    <header class="top-header">

        <div>
            <h1>Paluwagan Management System</h1>

            <p>
                Manage your Paluwagan batches and member payments
            </p>
        </div>

    </header>


    <!-- MAIN CONTENT -->

    <main class="container">

        <div class="page-title">

            <div>

                <h2>
                    My Paluwagan
                </h2>

                <p>
                    Manage your active Paluwagan batches
                </p>

            </div>


            <button
                class="add-batch-button"
                onclick="openAddBatchModal()">

                + Add Paluwagan

            </button>

        </div>


        <!-- PALUWAGAN CARDS -->

        <div
            id="paluwaganContainer"
            class="paluwagan-grid">

        </div>

    </main>


    <!-- ADD BATCH MODAL -->

    <div
        id="batchModal"
        class="modal">

        <div class="modal-content">

            <div class="modal-header">

                <h2>
                    Add Paluwagan
                </h2>


                <button
                    class="close-button"
                    onclick="closeBatchModal()">

                    ×

                </button>

            </div>


            <!-- PALUWAGAN AMOUNT -->

            <div class="form-group">

                <label>
                    Paluwagan Amount
                </label>

                <input
                    type="number"
                    id="batchAmount"
                    placeholder="Example: 10000">

            </div>


            <!-- NUMBER OF MONTHS -->

            <div class="form-group">

                <label>
                    Number of Months
                </label>

                <input
                    type="number"
                    id="batchMonths"
                    placeholder="Example: 6">

            </div>


            <!-- MONTHLY PAYMENT -->

            <div class="form-group">

                <label>
                    Monthly Payment
                </label>

                <input
                    type="number"
                    id="batchMonthly"
                    placeholder="Example: 2000">

            </div>


            <!-- START DATE -->

            <div class="form-group">

                <label>
                    Start Date
                </label>

                <input
                    type="date"
                    id="batchStartDate">

            </div>


            <button
                class="save-button"
                onclick="saveBatch()">

                Save Paluwagan

            </button>

        </div>

    </div>


    <!-- MEMBERS PAGE -->

    <div
        id="membersPage"
        class="members-page">

        <div class="container">


            <!-- BACK BUTTON -->

            <button
                class="back-button"
                onclick="closeMembersPage()">

                ← Back to Paluwagan

            </button>


            <!-- MEMBERS HEADER -->

            <div class="members-header">

                <div>

                    <h2 id="selectedBatchTitle">
                        Paluwagan
                    </h2>


                    <p id="selectedBatchDetails">
                    </p>

                </div>


                <button
                    class="add-member-button"
                    onclick="openAddMemberModal()">

                    + Add Member

                </button>

            </div>


            <!-- MEMBER LIST -->

            <div
                id="memberList"
                class="member-list">

            </div>

        </div>

    </div>


    <!-- ADD / EDIT MEMBER MODAL -->

    <div
        id="memberModal"
        class="modal">

        <div class="modal-content">


            <!-- MODAL HEADER -->

            <div class="modal-header">

                <h2 id="memberModalTitle">
                    Add Member
                </h2>


                <button
                    class="close-button"
                    onclick="closeMemberModal()">

                    ×

                </button>

            </div>


            <!-- MEMBER NAME -->

            <div class="form-group">

                <label>
                    Member Name
                </label>

                <input
                    type="text"
                    id="memberName"
                    placeholder="Enter member name">

            </div>


            <!-- PAYMENT AMOUNT -->

            <div class="form-group">

                <label>
                    Payment Amount
                </label>

                <input
                    type="number"
                    id="paymentAmount"
                    placeholder="Example: 2000">

            </div>


            <!-- PAYMENT DATE -->

            <div class="form-group">

                <label>
                    Payment Date
                </label>

                <input
                    type="date"
                    id="paymentDate">

            </div>


            <!-- PAYMENT STATUS -->

            <div class="form-group">

                <label>
                    Payment Status
                </label>


                <select id="paymentStatus">

                    <option value="Pending">
                        Pending
                    </option>

                    <option value="Done">
                        Done
                    </option>

                </select>

            </div>


            <!-- SAVE MEMBER -->

            <button
                class="save-button"
                onclick="saveMember()">

                Save Member

            </button>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
